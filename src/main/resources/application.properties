spring.application.name=ai-tutor

# Server Port
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_tutor
spring.datasource.username=${DB_USERNAME:ai_tutor}
spring.datasource.password=${DB_PASSWORD:ai_tutor}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=ai-tutor-secret-key-must-be-at-least-32-characters-long
jwt.expiration=86400000

spring.security.filter.order=10

# OAuth2 Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:disabled-kakao-client-id}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:disabled-kakao-client-secret}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# OpenAI API Key
openai.api.key=${OPENAI_API_KEY:}
openai.vision.model=${OPENAI_VISION_MODEL:gpt-4o}
openai.vision.enabled=${OPENAI_VISION_ENABLED:true}
openai.vision.max-pages=${OPENAI_VISION_MAX_PAGES:5}
openai.embedding.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# Qdrant vector store
qdrant.url=${QDRANT_URL:http://localhost:6333}
qdrant.collection=${QDRANT_COLLECTION:document_chunks}
qdrant.vector-size=${QDRANT_VECTOR_SIZE:1536}

# Ollama
ollama.enabled=${OLLAMA_ENABLED:true}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat.model=${OLLAMA_CHAT_MODEL:qwen2.5:7b}
ollama.temperature=${OLLAMA_TEMPERATURE:0.1}

# Upload Path
upload.path=uploads

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# File Upload Configuration
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# spring.jpa.hibernate.ddl-auto=create
